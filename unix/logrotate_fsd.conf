# FSD 日志轮转配置（fsd.log 由 fsd_d.sh 的 stdout 重定向写入，进程持续持有该文件）
# 用 copytruncate 避免向进程发信号；配合 crontab 每天执行一次。
# 安装：cp logrotate_fsd.conf /www/wwwroot/system.ldpfly.cn/map/online/
# cron：0 3 * * * /usr/sbin/logrotate -s /var/lib/logrotate/logrotate.status /www/wwwroot/system.ldpfly.cn/map/online/logrotate_fsd.conf

/www/wwwroot/system.ldpfly.cn/map/online/fsd.log {
    daily
    size 50M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
